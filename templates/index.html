<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>RX · Ghost Dispatcher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header id="app-header">
        <div class="brand">
            <div class="brand-pill">RX</div>
            <div class="brand-text">
                <div class="brand-title">Ghost Dispatcher</div>
                <div class="brand-subtitle">Rexis Trucking sandbox · multi-load routing</div>
            </div>
        </div>
        <div class="header-actions">
            <button id="btn-work-load" disabled>Work This Load</button>
        </div>
    </header>

    <main id="app-main">
        <section id="map-column">
            <div id="map"></div>
        </section>

        <section id="info-column">
            <div id="boards-row">
                <div class="panel">
                    <h2>VIP Board</h2>
                    <div id="vip-list" class="board-list"></div>
                </div>
                <div class="panel">
                    <h2>Open Load Board</h2>
                    <div id="open-list" class="board-list"></div>
                </div>
                <div class="panel">
                    <h2>Working Loads</h2>
                    <div id="working-list" class="board-list"></div>
                </div>
            </div>

            <div id="lower-row">
                <div class="panel wide">
                    <h2>Live Suggested Stream</h2>
                    <div id="suggested-list" class="board-list"></div>
                </div>
                <div class="panel">
                    <h2>Trucks</h2>
                    <div id="truck-list" class="board-list"></div>
                </div>
                <div class="panel">
                    <h2>Recent Decisions</h2>
                    <div id="decisions-list" class="board-list small"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Load detail modal -->
    <div id="detail-overlay">
        <div id="detail-modal">
            <div id="detail-header">
                <span>Load details</span>
                <button id="detail-close" type="button">×</button>
            </div>
            <div id="detail-body"></div>
        </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
        const COMPANY_ID = "{{ company_id }}";
    </script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
